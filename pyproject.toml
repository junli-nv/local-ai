[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-local-ai"
version = "1.3.3"
description = "Local GPU inference with OpenCode clients on BCM headnodes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_ai = ["profiles.json"]

[project.optional-dependencies]
dev = ["ruff==0.14.2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
