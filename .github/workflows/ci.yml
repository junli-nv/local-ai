name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client_version:
        description: Optional candidate OpenCode release for the native contract check
        required: false
        type: string
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: git diff --check

  client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Prepare selected native client
        env:
          CANDIDATE_VERSION: ${{ inputs.client_version }}
        run: |
          if [ -n "$CANDIDATE_VERSION" ]; then
            ./local-ai client install --client-dir /tmp/local-ai-client --version "$CANDIDATE_VERSION"
          else
            ./local-ai client install --client-dir /tmp/local-ai-client
          fi
      - run: python scripts/check-client.py --client-dir /tmp/local-ai-client
