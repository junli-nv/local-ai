name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client_version:
        description: Optional candidate OpenCode release for the native contract check
        required: false
        type: string
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: git diff --check
      - name: Check packaged documentation
        run: |
          git archive --format=tar --prefix=local-ai/ --output=/tmp/local-ai-source-docs.tar HEAD
          python scripts/check_release_docs.py --archive /tmp/local-ai-source-docs.tar

  client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Prepare selected native client
        env:
          CANDIDATE_VERSION: ${{ inputs.client_version }}
        run: |
          if [ -n "$CANDIDATE_VERSION" ]; then
            ./local-ai client install --client-dir /tmp/local-ai-client --version "$CANDIDATE_VERSION"
          else
            ./local-ai client install --client-dir /tmp/local-ai-client
          fi
      - run: python scripts/check-client.py --client-dir /tmp/local-ai-client
      - run: python scripts/check-reasoning.py --client-dir /tmp/local-ai-client
      - run: python scripts/check-instructions.py --client-dir /tmp/local-ai-client
      - run: python scripts/check-observer.py --client-dir /tmp/local-ai-client
      - name: Measure follow-up delivery during a shell call
        run: python scripts/check-steering.py --client-dir /tmp/local-ai-client --output /tmp/local-ai-steering-evidence
      - name: Preserve steering probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steering-probe
          path: /tmp/local-ai-steering-evidence
          if-no-files-found: ignore
